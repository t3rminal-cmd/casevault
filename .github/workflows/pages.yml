# Publishes CaseVault to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy CaseVault

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # the jobs never push; don't leave a token in .git

      - name: No case data in the repository
        run: bash scripts/check-no-case-data.sh

      - name: Updater tests (offline, fake GitHub)
        run: python3 -m unittest discover -s updater/tests -v

      - name: App makes no external requests (offline rule)
        run: |
          # Any http(s) URL in the shipped app files must point at localhost (the Ollama engine on
          # this PC). v1.91: the online AI features are gone, so no cloud host is allowed.
          # XML namespace names used when reading/writing Word files are identifiers, never fetched:
          # schemas.openxmlformats.org, purl.org/dc, www.w3.org/2001/XMLSchema-instance, and the SVG
          # namespace www.w3.org/2000/svg used to draw the icons. js/reference/links.js holds the
          # Quick links' web addresses: plain links the user clicks to open in a new tab (no
          # referrer), never fetched by CaseVault, so that one file is left out of this check.
          hits=$(grep -EnoH 'https?://[^"'"'"' )<>]+' index.html sw.js manifest.webmanifest css/*.css js/*.js js/checker/*.js js/drafts/*.js js/ai/*.js js/secure/*.js $(ls js/reference/*.js | grep -v '/links.js$') \
                 | grep -Ev 'https?://(localhost|127\.0\.0\.1)(:[0-9]+)?|http://schemas\.openxmlformats\.org/|http://purl\.org/dc/|http://www\.w3\.org/2001/XMLSchema-instance|http://www\.w3\.org/2000/svg' || true)
          if [ -n "$hits" ]; then
            echo "::error::External URLs found in app files. CaseVault must work 100% offline:"
            echo "$hits"
            exit 1
          fi
          echo "OK: app files reference no external hosts."

      - name: JavaScript parses
        run: |
          for f in js/*.js js/checker/*.js js/drafts/*.js js/secure/*.js js/reference/*.js scripts/*.js js/ai/*.js tests/e2e/*.js sw.js; do node --check "$f"; done

      - name: Content-Security-Policy allows no other hosts
        run: |
          csp=$(grep -o 'connect-src[^;]*' index.html)
          echo "$csp"
          extra=$(echo "$csp" | tr ' ' '\n' | grep -E '^https?://' | grep -Ev '^http://(localhost|127\.0\.0\.1):11434$' || true)
          if [ -n "$extra" ]; then echo "::error::Unexpected host in connect-src: $extra"; exit 1; fi

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Every file the service worker caches exists
        run: |
          missing=0
          for f in $(grep -Eo "'\./[^']*'" sw.js | tr -d "'" | sed 's#^\./##'); do
            [ -z "$f" ] && continue
            [ -f "$f" ] || { echo "::error::sw.js caches missing file: $f"; missing=1; }
          done
          exit $missing

  browser:
    # v1.98: the whole app, driven in Chromium with made-up Doe/Roe/Poe cases (tests/e2e/), plus the
    # helper's drive-encryption check in PowerShell 7. Nothing here touches real case data.
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # the jobs never push; don't leave a token in .git

      - name: Install Playwright and Chromium (test tools only; not part of the app)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run the browser tests
        env:
          PWSH: pwsh
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/e2e/run.js

  deploy:
    name: Publish to GitHub Pages
    needs: [check, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # the jobs never push; don't leave a token in .git

      - name: Assemble the site (app files only)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons vendor _site/
          # Stamp the service worker so each deploy gets a fresh offline cache.
          sed -i "s/const BUILD = 'dev';/const BUILD = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "const BUILD = '${GITHUB_SHA::12}';" _site/sw.js
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
