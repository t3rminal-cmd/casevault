<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Privacy lock: the page may load only its own files, and may only ever talk to
       localhost (the local Ollama AI engine). CaseVault never connects to the internet. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; font-src 'self'; connect-src 'self' http://localhost:11434 http://127.0.0.1:11434; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Offline case file manager. All data stays on your own SSD.">
  <title>CaseVault</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
  <script src="js/options.js"></script>
</head>
<body>
  <!-- Gate: shown until a vault on the SSD is connected -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-title">
      <img src="icons/icon-192.png" alt="" class="gate-logo" width="56" height="56">
      <h1 id="gate-title">CaseVault</h1>
      <p id="gate-message"></p>
      <p id="gate-detail" class="muted"></p>
      <div id="gate-actions" class="gate-actions"></div>
      <p class="gate-foot muted">Your case data is read from and written to your SSD only. Nothing is stored on this computer or sent anywhere.</p>
    </div>
  </div>

  <header class="topbar">
    <div class="tb-left">
    <button id="btn-sidebar-expand" class="icon-btn" type="button" aria-controls="sidebar-body" aria-expanded="false" title="Show the case list (Ctrl+\)" hidden><svg class="icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg><span class="sr-only">Show the case list</span></button>
      <a class="brand" href="#/" title="Overview">
        <img src="icons/icon-192.png" alt="" width="30" height="30">
        <span class="brand-text"><span class="brand-name">CaseVault</span><span class="vault-name" id="vault-name" title="Where your case data is being saved"></span></span>
      </a>
    </div>
    <div class="tb-status" aria-label="Status">
      <button id="net-status" class="net-status" type="button" hidden></button>
      <button id="engine-status" class="engine-status" type="button" hidden></button>
      <span id="ai-activity" class="ai-activity" hidden></span>
      <span id="mem-status" class="mem-status" hidden></span>
      <div id="save-status" class="save-status" role="status" aria-live="polite"></div>
      <button id="btn-power" class="icon-btn power-btn" type="button" data-icon="power" title="Power Off: save, close, eject drives"><span class="sr-only">Power Off</span></button>
    </div>
    <div class="tb-right">
      <button id="btn-chat" class="icon-btn tb-square" type="button" data-icon="chat-dots-fill" aria-controls="chat-float" aria-expanded="false" title="Ask AI: ask the AI on this computer anything, or about a case, in a box you can keep open while you work. Nothing leaves this PC."><span class="sr-only">Ask AI</span></button>
      <button id="btn-privacy" class="icon-btn tb-square" type="button" data-icon="incognito" title="Hide: privacy screen"><span class="sr-only">Hide</span></button>
      <div class="menu-wrap">
        <button id="btn-menu" class="icon-btn menu-btn tb-square" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="app-menu" title="Menu"><span class="sr-only">Menu</span></button>
        <div id="app-menu" class="app-menu" role="menu" hidden>
          <button id="btn-theme" class="menu-item theme-toggle" role="menuitem" type="button" title="Theme"><span class="sr-only">Theme</span></button>
          <button id="btn-options" class="menu-item" role="menuitem" type="button" data-icon="sliders2" title="Zoom, brightness and Dev Tools">Options</button>
          <button id="btn-contact-dev" class="menu-item" role="menuitem" type="button" data-icon="bug" title="Report a bug or ask for a feature">Contact Dev</button>
          <button id="btn-problem" class="menu-item" role="menuitem" type="button" data-icon="clipboard2-pulse" title="Save the app version, browser and recent errors to a text file, with no case data, to send to the developer">Report a Problem</button>
          <button id="btn-shortcuts" class="menu-item" role="menuitem" type="button" data-icon="lightning-charge" title="Keyboard shortcuts (?)">Keyboard Shortcuts</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button id="btn-sidebar-collapse" class="icon-btn" type="button" aria-controls="sidebar-body" aria-expanded="true" title="Hide the case list (Ctrl+\)"><svg class="icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg><span class="sr-only">Hide the case list</span></button>
        <button id="btn-rail-new" class="icon-btn rail-only" type="button" title="New case"><svg class="icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="sr-only">New case</span></button>
      </div>
      <div class="sidebar-body" id="sidebar-body">
      <div class="sidebar-tools">
        <button id="btn-new-case" class="btn primary block" type="button" data-icon="plus-lg" hidden>New Case</button>
        <div class="search-wrap" data-icon="search"><input id="case-search" type="search" placeholder="Search cases" aria-label="Search cases" title="Case number, title, subject, Mission, status or a Case History note" autocomplete="off"></div>
      </div>
      <ul id="case-list" class="case-list" aria-label="Cases"></ul>
      <div id="side-bottom" class="side-bottom">
      <details id="closed-cases" class="archived-cases closed-cases">
        <summary><span class="sec-label">CLOSED FILES</span> <span class="count-pill" id="closed-count">0</span></summary>
        <ul id="closed-list" class="case-list" aria-label="Closed operations"></ul>
      </details>
      <details id="archived-cases" class="archived-cases">
        <summary><span class="sec-label">ARCHIVED</span> <span class="count-pill" id="archived-count">0</span></summary>
        <ul id="archived-list" class="case-list" aria-label="Archived cases"></ul>
      </details>
      </div>
      </div>
    </aside>

    <div class="main-col">
      <main id="main" class="main" tabindex="-1"></main>
      <!-- v1.63: Quick Links footer (Overview only), from the case list to the right edge. -->
      <footer id="ql-footer" class="ql-footer" hidden></footer>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="dialog" class="dialog"></dialog>

  <script src="js/icons-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/tooltip.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/timefield.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/helper-fs.js"></script>
  <script src="js/casefiles.js"></script>
  <script src="js/operation.js"></script>
  <script src="js/limitations.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/format-bar.js"></script>
  <script src="js/rich-editor.js"></script>
  <script src="js/checker/nlp.js"></script>
  <script src="js/checker/rules.js"></script>
  <script src="js/checker/sheets.js"></script>
  <script src="js/checker/xfa.js"></script>
  <script src="js/docxview.js"></script>
  <script src="js/checker/extract.js"></script>
  <script src="js/checker/ai.js"></script>
  <script src="js/ai/activity.js"></script>
  <script src="js/ai/hardware.js"></script>
  <script src="js/checker/checks-ui.js"></script>
  <script src="js/drafts/draft-core.js"></script>
  <script src="js/drafts/docx.js"></script>
  <script src="js/drafts/ghost.js"></script>
  <script src="js/drafts/copilot.js"></script>
  <script src="js/drafts/review.js"></script>
  <script src="js/drafts/drafts-ui.js"></script>
  <script src="js/secure/pii.js"></script>
  <script src="js/secure/outbound.js"></script>
  <script src="js/secure/mail.js"></script>
  <script src="js/secure/mail-ui.js"></script>
  <script src="js/secure/settings-ui.js"></script>
  <script src="js/ai/memory.js"></script>
  <script src="js/privacy.js"></script>
  <script src="js/selftest.js"></script>
  <script src="js/closing.js"></script>
  <script src="js/closing-ui.js"></script>
  <script src="js/combo.js"></script>
  <script src="js/select.js"></script>
  <script src="js/report-fields.js"></script>
  <script src="js/pdf-viewer.js"></script>
  <script src="js/discovery-core.js"></script>
  <script src="js/discovery-receipt.js"></script>
  <script src="js/discovery-ui.js"></script>
  <script src="js/linkchart.js"></script>
  <script src="js/linkchart-ui.js"></script>
  <script src="js/report-pdf.js"></script>
  <script src="js/arrest-pdf.js"></script>
  <script src="js/letterhead.js"></script>
  <script src="js/case-summary.js"></script>
  <script src="js/draft-pdf.js"></script>
  <script src="js/report-fields-ui.js"></script>
  <script src="js/ai/chat.js"></script>
  <script src="js/ai/chat-ui.js"></script>
  <script src="js/notes-float.js"></script>
  <script src="js/secure/locker-core.js"></script>
  <script src="js/locker-ui.js"></script>
  <script src="js/library.js"></script>
  <script src="js/library-ui.js"></script>
  <script src="js/reference/links.js"></script>
  <script src="js/reference/ref-data.js"></script>
  <script src="js/reference/reference.js"></script>
  <script src="js/reference/ref-ui.js"></script>
  <script src="js/case-overview.js"></script>
  <script src="js/case-search.js"></script>
  <script src="js/backup-restore.js"></script>
  <script src="js/case-timeline.js"></script>
  <script src="js/files-tab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
